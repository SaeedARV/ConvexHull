[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "convex-hull-approx"
version = "0.1.0"
description = "Convex hull approximation solvers and experiments for research."
requires-python = ">=3.11"
readme = "README.md"

[tool.scikit-build]
wheel.packages = ["src/convex_hull"]
minimum-version = "0.11"

[tool.scikit-build.cmake]
version = ">=3.18"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
